root = "."
tmp_dir = "bin"

[build]
  # task dev exports .env, so a dev build carries the shared TMDB key the way a
  # release does. Unset, the expansion is empty and the build works without it.
  cmd = "go build -ldflags \"-X github.com/sirrobot01/snagarr/internal/config.DefaultTMDBKey=${SNAGARR_EMBEDDED_TMDB_KEY}\" -o ./bin/snagarr ./cmd/snagarr"
  bin = "./bin/snagarr"
  args_bin = ["serve"]
  include_ext = ["go", "sql"]
  exclude_dir = ["web", "dist", "bin", "tmp", "data", "node_modules", ".venv", ".ven", ".idea", ".stfolder", "website"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[log]
  time = true

[misc]
  clean_on_exit = true
